name: Validate and package
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publish a prerelease or a full release
        type: choice
        options: [prerelease, release]
        default: prerelease
      version:
        description: 'Version (e.g. 1.0.0); leave blank to continue the current release line'
        type: string
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select the published release line
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_KIND: ${{ inputs.release_type }}
        run: node scripts/release-version.mjs
  windows-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare signing credentials for trusted master runs
        id: signing
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          FRAME_WINDOWS_SHELL_PRIVATE_KEY_PEM: ${{ secrets.FRAME_WINDOWS_SHELL_PRIVATE_KEY_PEM }}
          FRAME_WINDOWS_SHELL_CERTIFICATE_PEM: ${{ secrets.FRAME_WINDOWS_SHELL_CERTIFICATE_PEM }}
        run: node scripts/ci-shell-signing.mjs
      - name: Build pinned signing tool and install native compiler
        if: steps.signing.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev zlib1g-dev g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
          signing_tools="$RUNNER_TEMP/frame-signing-tools"
          mkdir -p "$signing_tools/source"
          curl --fail --location --retry 3 --silent --show-error https://api.github.com/repos/mtrojnar/osslsigncode/tarball/2.14 --output "$signing_tools/source.tar.gz"
          printf '%s  %s\n' bdf249cbf23a84262dd30bb9b3a96a17109ff8de5ea30212e26af173cc8b2195 "$signing_tools/source.tar.gz" | sha256sum --check
          tar -xzf "$signing_tools/source.tar.gz" --strip-components=1 -C "$signing_tools/source"
          cmake -S "$signing_tools/source" -B "$signing_tools/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$signing_tools/build" --parallel 2
          bash scripts/build-msix-sdk.sh "$RUNNER_TEMP/frame-msix-sdk"
          printf 'FRAME_MAKEMSIX=%s\n' "$RUNNER_TEMP/frame-msix-sdk/build/bin/makemsix" >> "$GITHUB_ENV"
      - name: Sign shell package and rebuild the pinned Windows helper
        if: steps.signing.outputs.enabled == 'true'
        run: |
          FRAME_OSSLSIGNCODE="$RUNNER_TEMP/frame-signing-tools/build/osslsigncode" FRAME_MAKEMSIX="$RUNNER_TEMP/frame-msix-sdk/build/bin/makemsix" npm run sign:windows-shell
          FRAME_MINGW_ROOT=/usr npm run build:windows-shell
      - name: Delete temporary signing credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/frame-shell-signing"
      - name: Verify the public shell package and native fingerprints
        run: node --test tests/setup/windows-shell.test.mjs
      - name: Share only public Windows shell assets
        uses: actions/upload-artifact@v4
        with:
          name: frame-windows-shell
          path: |
            native/windows-shell/bin/x64/FrameShell.dll
            native/windows-shell/bin/x64/FrameShellLauncher.exe
            native/windows-shell/bin/x64/FrameCertificateHelper.exe
            native/windows-shell/binaries.json
            native/windows-shell/identity.json
            native/windows-shell/package/FrameShell.msix
            native/windows-shell/package/Frame.cer
            native/windows-shell/package/signature.json
          if-no-files-found: error
  pnpm-install:
    needs: version
    env:
      FRAME_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: '12.10.1'
      - run: node scripts/release-version.mjs --apply
      - run: pnpm import
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:desktop
      - run: node --test tests/setup/*.test.mjs
  web:
    needs: version
    env:
      FRAME_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/release-version.mjs --apply
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: test-results/browser/
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frame-web
          path: dist/
  desktop:
    needs: [windows-shell, version]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FRAME_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the verified CI shell package
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: frame-windows-shell
          path: native/windows-shell
      - name: Validate shell package using the Windows Appx reader
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/validate-windows-shell.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/release-version.mjs --apply
      - run: npm ci
      - run: npm test
      - name: Configure Electron's Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Test Electron (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Test Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - run: npm run package
        if: runner.os != 'macOS'
      - name: Build and ad-hoc sign the macOS disk image
        if: runner.os == 'macOS'
        # Ad-hoc signing needs no certificate or private credentials, including on PRs.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run package
      - name: Verify signatures and test the app installed from the macOS disk image
        if: runner.os == 'macOS'
        run: bash scripts/test-macos-package.sh
      - name: Disable Developer Mode on the disposable Windows test runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Verify the signed shell package works without Developer Mode; Frame never changes this policy.
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 0 -PropertyType DWord -Force | Out-Null
      - name: Test installed Windows context-menu actions and uninstall cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-shell.ps1
      - name: Save desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-diagnostics-${{ matrix.os }}
          path: test-results/desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: frame-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
  release:
    name: Publish desktop installers
    needs: [version, web, pnpm-install, desktop]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      FRAME_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      FRAME_RELEASE_KIND: ${{ needs.version.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect all four verified desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: frame-desktop-*
          merge-multiple: true
          path: installers
      - name: Verify completeness and generate checksums
        id: release
        run: node scripts/prepare-release.mjs installers "$RUNNER_TEMP/frame-release-notes.md"
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$FRAME_RELEASE_KIND" = release ]; then
              echo "Full release $RELEASE_TAG already exists; choose a new version." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            release_flags=(--prerelease)
            if [ "$FRAME_RELEASE_KIND" = release ]; then release_flags=(--latest); fi
            gh release create "$RELEASE_TAG" installers/* \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
              "${release_flags[@]}" --generate-notes --notes-file "$RUNNER_TEMP/frame-release-notes.md"
          fi
  pages:
    name: Deploy full release to GitHub Pages
    needs: [version, release]
    if: needs.version.outputs.kind == 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
