# Example location block for the complete Vite dist/ directory.
location / {
    root /srv/frame/dist;
    index index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    try_files $uri $uri/ /index.html;
}
# Ensure your mime.types includes: application/wasm wasm;
