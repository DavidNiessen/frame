# pnpm 10.26+ / 11 / 12 requires explicit permission for dependency install scripts.
# Electron downloads its runtime; FFmpeg and yt-dlp are prepared from vendor/media-tools.
# yauzl 2's file streams can stop mid-extraction on Node 24.16.0.
# Keep npm's matching package.json override in sync.
overrides:
  'extract-zip>yauzl': 3.4.0
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-ia32': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-ia32': true
  '@ffprobe-installer/win32-x64': true
